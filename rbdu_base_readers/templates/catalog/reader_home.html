{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center my-5 py-4">
    <div class="col-md-9 col-lg-8 text-center">
        <h1 class="display-4 fw-bold text-primary mb-3">Электронный каталог</h1>
        <p class="lead text-secondary mb-5">Библиотека им. К. Баялинова — найдите нужную книгу в два клика</p>
        
        <div class="card shadow border-0 p-4 mb-5 bg-white">
            <form method="GET" action="{% url 'catalog:book_list' %}" class="row g-2">
                <div class="col-md-9">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" name="q" class="form-control border-start-0 fs-5 ps-0" placeholder="Введите название книги или имя автора...">
                    </div>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Найти книгу</button>
                </div>
            </form>
        </div>

        <h4 class="text-start fw-bold text-dark mb-4"><i class="bi bi-tags-fill text-primary"></i> Отрасли знаний</h4>
        <div class="row row-cols-1 row-cols-md-3 g-3 text-start">
            {% for sec in sections %}
            <div class="col">
                <a href="{% url 'catalog:book_list' %}?section={{ sec.id }}" class="card h-100 border border-light-subtle shadow-sm text-decoration-none text-dark card-hover transition" style="transition: all 0.2s;">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span class="fw-semibold text-truncate pe-2">{{ sec.name }}</span>
                        <span class="badge bg-primary-subtle text-primary rounded-pill">{{ sec.total }}</span>
                    </div>
                </a>
            </div>
            {% empty %}
            <div class="col-12 text-center text-muted">Разделы еще не добавлены</div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    /* Эффект наведения на карточки категорий */
    .card-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 15px rgba(0,0,0,0.1) !important;
        border-color: var(--bs-primary) !important;
    }
</style>
{% endblock %}
