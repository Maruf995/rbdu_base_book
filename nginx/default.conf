upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _; # Принимать запросы с любого IP/Домена

    # Проксирование запросов к Django
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 100M; # Позволяет загружать большие Excel файлы
    }

    # Отдача статических файлов (CSS, JS) напрямую через Nginx
    location /static/ {
        alias /app/static/;
    }
}
