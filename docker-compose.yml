services:
  db_shared:
    image: postgres:15-alpine
    container_name: library_postgres_shared
    restart: always
    env_file: .env
    volumes:
      - postgres_data_shared:/var/lib/postgresql/data

  # ===================== BOOK =====================
  web_book:
    build: ./rbdu_base_book
    container_name: library_django_book
    env_file:
      - .env
      - ./rbdu_base_book/.env
    volumes:
      - static_volume_book:/app/static
    depends_on:
      - db_shared
    command: >
      sh -c "
      echo 'BOOK: wait db...' &&
      sleep 10 &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python create_superuser.py &&
      exec gunicorn library_system.wsgi:application --bind 0.0.0.0:8000
      "

  # ===================== READERS =====================
  web_readers:
    build: ./rbdu_base_readers
    container_name: library_django_readers
    env_file:
      - .env
      - ./rbdu_base_readers/.env
    volumes:
      - static_volume_readers:/app/static
    depends_on:
      - db_shared
    command: >
      sh -c "
      echo 'READERS: wait db...' &&
      sleep 10 &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python create_superuser.py &&
      exec gunicorn rbdu_base_readers.wsgi:application --bind 0.0.0.0:8000
      "

  # ===================== NGINX =====================
  nginx:
    image: nginx:alpine
    container_name: library_nginx_shared
    restart: always
    ports:
      - "8080:80"
      - "8081:81"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume_book:/var/www/book/static
      - static_volume_readers:/var/www/readers/static
    depends_on:
      - web_book
      - web_readers

volumes:
  postgres_data_shared:
  static_volume_book:
  static_volume_readers: