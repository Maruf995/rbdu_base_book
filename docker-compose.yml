services:
  db:
    image: postgres:15-alpine
    container_name: library_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    container_name: library_django
    restart: always
    # МАГИЯ ТУТ: Docker Compose сам возьмет значения из .env и передаст их в Django
    environment:
      - DJANGO_SUPERUSER_USERNAME=${POSTGRES_USER}
      - DJANGO_SUPERUSER_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py createsuperuser --noinput || echo 'Суперпользователь уже существует') &&
             python manage.py collectstatic --noinput &&
             gunicorn library_system.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/static
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: library_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: